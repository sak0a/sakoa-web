name: dodgeball-platform

x-database-environment: &database-environment
  DB_HOST: ${DB_HOST:-}
  DB_PORT: ${DB_PORT:-3306}
  DB_USER: ${DB_USER:-}
  DB_PASSWORD: ${DB_PASSWORD:-}
  DB_NAME: ${DB_NAME:-}

x-service-defaults: &service-defaults
  init: true
  restart: unless-stopped
  stop_grace_period: 30s

services:
  web:
    <<: *service-defaults
    build:
      context: .
      dockerfile: Dockerfile
      target: web
      args:
        BUN_VERSION: 1.4.1
        NODE_VERSION: 24.20.0
    image: ${WEB_IMAGE:-dodgeball-web:local}
    environment:
      <<: *database-environment
      NITRO_HOST: 0.0.0.0
      NITRO_PORT: 3000
      NUXT_DB_HOST: ${DB_HOST:-}
      NUXT_DB_PORT: ${DB_PORT:-3306}
      NUXT_DB_USER: ${DB_USER:-}
      NUXT_DB_PASSWORD: ${DB_PASSWORD:-}
      NUXT_DB_NAME: ${DB_NAME:-}
      NUXT_ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      NUXT_ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET:-}
      NUXT_STEAM_API_KEY: ${STEAM_API_KEY:-}
      NUXT_PUBLIC_SERVER_IP: ${PUBLIC_SERVER_IP:-}
      NUXT_PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-http://localhost:3000}
    ports:
      - "${WEB_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(response => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 5

  bot:
    <<: *service-defaults
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
      args:
        BUN_VERSION: 1.4.1
        NODE_VERSION: 24.20.0
    image: ${BOT_IMAGE:-dodgeball-bot:local}
    command: ["node", ".output/services/bot/index.mjs"]
    environment:
      <<: *database-environment
      DISCORD_TOKEN: ${DISCORD_TOKEN:-}
      BOT_INSTANCE_ID: ${BOT_INSTANCE_ID:-dodgeball-bot}
      BOT_HEARTBEAT_STALE_SECONDS: ${BOT_HEARTBEAT_STALE_SECONDS:-120}
      DISCORD_JOB_POLL_MS: ${DISCORD_JOB_POLL_MS:-2000}
      DISCORD_CONFIG_POLL_MS: ${DISCORD_CONFIG_POLL_MS:-10000}
      DISCORD_HEARTBEAT_MS: ${DISCORD_HEARTBEAT_MS:-15000}
      DISCORD_JOB_LOCK_SECONDS: ${DISCORD_JOB_LOCK_SECONDS:-120}
    healthcheck:
      test: ["CMD", "node", ".output/services/bot/healthcheck.mjs"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 5

  migrate:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: Dockerfile
      target: migrate
      args:
        BUN_VERSION: 1.4.1
        NODE_VERSION: 24.20.0
    image: ${BOT_IMAGE:-dodgeball-bot:local}
    environment:
      <<: *database-environment
    restart: "no"
    command: ["node", ".output/services/database/migrate.mjs"]
